name: Validate Aperture Refresh

on:
  push:
    branches:
      - feature-guides-dial-aperture-range
    paths:
      - tools/refresh_aperture_limits.py
      - .github/workflows/validate-aperture-refresh.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature-guides-dial-aperture-range
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew
      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Apply aperture refresh patch
        run: python tools/refresh_aperture_limits.py
      - name: Build Debug APK
        run: ./gradlew :demo:assembleDebug --stacktrace
      - name: Commit validated source
        run: |
          rm -f tools/refresh_aperture_limits.py .github/workflows/validate-aperture-refresh.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sonycamera/src/main/java/io/github/gallo/sonycamera/ptp/SonyPtpCamera.kt
          git add -u tools/refresh_aperture_limits.py .github/workflows/validate-aperture-refresh.yml || true
          git commit -m "Refresh lens aperture limits from camera"
          git push origin HEAD:feature-guides-dial-aperture-range
