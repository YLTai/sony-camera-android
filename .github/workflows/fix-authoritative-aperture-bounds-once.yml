name: Fix Authoritative Aperture Bounds Once

on:
  push:
    branches:
      - main
    paths:
      - tools/fix_authoritative_aperture_bounds.py
      - .github/workflows/fix-authoritative-aperture-bounds-once.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew
      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Apply authoritative aperture bounds fix
        run: python tools/fix_authoritative_aperture_bounds.py
      - name: Build Debug APK
        run: ./gradlew :demo:assembleDebug --stacktrace
      - name: Upload final candidate APK
        uses: actions/upload-artifact@v4
        with:
          name: sony-camera-authoritative-aperture-debug
          path: demo/build/outputs/apk/debug/demo-debug.apk
          if-no-files-found: error
      - name: Commit clean source
        run: |
          rm -f tools/fix_authoritative_aperture_bounds.py .github/workflows/fix-authoritative-aperture-bounds-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sonycamera/src/main/java/io/github/gallo/sonycamera/ptp/SonyPtpCamera.kt
          git add -u tools/fix_authoritative_aperture_bounds.py .github/workflows/fix-authoritative-aperture-bounds-once.yml || true
          git commit -m "Use only camera-reported aperture limits"
          git push origin HEAD:main
