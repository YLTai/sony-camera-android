name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Apply staged a7C II remote runtime probe
        run: |
          if [ -f tools/patch_a7c2_remote_runtime_probe.py ]; then
            python3 tools/patch_a7c2_remote_runtime_probe.py
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add sonycamera/src/main/java/io/github/gallo/sonycamera/ptp/PtpConstants.kt
            git add sonycamera/src/main/java/io/github/gallo/sonycamera/ptp/SonyPtpCamera.kt
            git add sonycamera/src/main/java/io/github/gallo/sonycamera/usb/UsbCameraConnectionManager.kt
            git rm tools/patch_a7c2_remote_runtime_probe.py
            git commit -m "diag: trace a7C II remote touch runtime states"
            git push
          fi

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Show Android SDK info
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          which sdkmanager
          sdkmanager --version

      - name: Install Android SDK 35
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Build Debug APK
        run: ./gradlew :demo:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: sony-camera-demo-debug
          path: demo/build/outputs/apk/debug/demo-debug.apk
          if-no-files-found: error

# Temporary validation target: restore ILCE-7CM2 D2E4 and non-queued sample E004/E005/D285 for 0.9s after touch. No synthetic AF box; Drive remains removed.
