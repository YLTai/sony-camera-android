name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Archive matching sources
        run: git archive --format=tar HEAD -o "${RUNNER_TEMP}/sony-camera-source.tar"

      - name: Upload matching sources
        uses: actions/upload-artifact@v4
        with:
          name: sony-camera-source
          path: ${{ runner.temp }}/sony-camera-source.tar
          retention-days: 3
          if-no-files-found: error

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Run unit tests and build Debug APK
        run: ./gradlew :sonycamera:testDebugUnitTest :demo:assembleDebug --stacktrace

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sony-camera-test-reports
          path: sonycamera/build/reports/tests/
          if-no-files-found: ignore

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: sony-camera-demo-debug
          path: demo/build/outputs/apk/debug/demo-debug.apk
          if-no-files-found: error
