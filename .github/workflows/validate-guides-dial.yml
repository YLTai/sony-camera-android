name: Validate Guides Dial

on:
  push:
    branches:
      - feature-guides-dial-aperture-range
    paths:
      - tools/patch_guides_dial.py
      - .github/workflows/validate-guides-dial.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature-guides-dial-aperture-range
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew
      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Apply feature patch
        run: python tools/patch_guides_dial.py
      - name: Build Debug APK
        run: ./gradlew :demo:assembleDebug --stacktrace
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: sony-camera-guides-dial-debug
          path: demo/build/outputs/apk/debug/demo-debug.apk
          if-no-files-found: error
      - name: Commit validated source and clean temporary files
        run: |
          rm -f tools/patch_guides_dial.py .github/workflows/validate-guides-dial.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add composition guides and dial controls"
          git push origin HEAD:feature-guides-dial-aperture-range
