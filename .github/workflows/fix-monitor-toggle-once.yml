name: Fix Monitor Toggle Once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-monitor-toggle-once.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - uses: gradle/actions/setup-gradle@v4
      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Apply polish
        run: python .github/scripts/fix_monitor_toggle.py
      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew :demo:assembleDebug --stacktrace
      - name: Commit clean source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/scripts/fix_monitor_toggle.py .github/workflows/fix-monitor-toggle-once.yml
          git add demo/src/main/java/io/github/gallo/sonycamera/demo/CameraScreen.kt
          git commit -m "Polish monitor tool toggles"
          git push origin HEAD:main
