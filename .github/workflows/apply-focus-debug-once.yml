name: Apply focus debug instrumentation

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/apply-focus-debug-once.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply focus debug patch
        run: python3 tools/apply_focus_debug.py

      - name: Commit and push source changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add focus-area debug diagnostics"
          git push origin HEAD:main
