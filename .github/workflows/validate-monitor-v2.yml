name: Validate Monitor Tools V2

on:
  push:
    branches:
      - feature-monitor-tools-v2
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature-monitor-tools-v2
          fetch-depth: 0

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Apply backend patch
        run: python .github/scripts/monitor_v2_backend.py

      - name: Build Debug APK
        run: |
          chmod +x gradlew
          ./gradlew :demo:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: sony-camera-monitor-tools-v2
          path: demo/build/outputs/apk/debug/demo-debug.apk
          if-no-files-found: error

      - name: Commit validated backend and clean temporary files
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/scripts/monitor_v2_backend.py .github/workflows/validate-monitor-v2.yml
          git add sonycamera demo
          git commit -m "Add Sony-style monitor controls and tools"
          git push origin HEAD:feature-monitor-tools-v2
