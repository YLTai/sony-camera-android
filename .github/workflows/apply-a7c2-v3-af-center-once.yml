name: Apply A7C II Protocol 3 AF Test

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch-build-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Apply A7C II protocol 3 patch
        run: python3 tools/apply_a7c2_v3_af_center.py

      - name: Build patched APK
        run: |
          chmod +x gradlew
          ./gradlew :demo:assembleDebug --stacktrace

      - name: Upload patched APK
        uses: actions/upload-artifact@v4
        with:
          name: sony-camera-a7c2-v3-debug
          path: demo/build/outputs/apk/debug/demo-debug.apk
          if-no-files-found: error

      - name: Commit patched source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No source changes"
            exit 0
          fi
          git commit -m "Add A7C II protocol 3 AF center test"
          git push origin HEAD:main
