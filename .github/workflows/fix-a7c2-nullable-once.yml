name: Fix A7C II Kotlin build

on:
  push:
    paths:
      - '.github/workflows/fix-a7c2-nullable-once.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply nullable parsing fix
        run: python3 tools/fix_a7c2_nullable.py

      - name: Commit and push fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix nullable AF diagnostic parsing"
          git push
