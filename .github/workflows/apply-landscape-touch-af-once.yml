name: Apply Landscape Touch AF

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/apply-landscape-touch-af-once.yml'

permissions:
  contents: write

jobs:
  patch-build-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Fix Compose imports in patch script
        run: |
          sed -i '/import androidx.compose.foundation.layout.matchParentSize/d' tools/apply_landscape_touch_af.py
          sed -i '/import androidx.compose.foundation.layout.weight/d' tools/apply_landscape_touch_af.py
          sed -i 's/\.matchParentSize()/\.fillMaxSize()/g' tools/apply_landscape_touch_af.py

      - name: Apply landscape touch AF patch
        run: python3 tools/apply_landscape_touch_af.py

      - name: Build patched APK
        run: |
          chmod +x gradlew
          ./gradlew :demo:assembleDebug --stacktrace

      - name: Upload patched APK
        uses: actions/upload-artifact@v4
        with:
          name: sony-camera-landscape-touch-af
          path: demo/build/outputs/apk/debug/demo-debug.apk
          if-no-files-found: error

      - name: Commit patched source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Add landscape touch AF camera UI'
          git push origin main
